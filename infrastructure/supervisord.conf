[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; Every program logs to the container's stdout, prefixed by name.
; Every program restarts on its own if it crashes; nothing else is touched.

[program:mosquitto]
command=mosquitto -c /etc/mosquitto/mosquitto.conf
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mediamtx]
command=/usr/local/bin/mediamtx
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dock-handshake]
command=/opt/venv-paho1/bin/python -u /app/dock_handshake.py
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:telemetry-bridge]
command=/opt/venv-paho1/bin/python -u /app/telemetry_bridge.py
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:flight-command-bridge]
command=/opt/venv-paho2/bin/python -u /app/flight_command_bridge.py
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:edge-server]
command=/app/server
priority=30
autorestart=true
; Without a dock this exits straight away; retry with backoff instead of spinning.
startsecs=5
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
