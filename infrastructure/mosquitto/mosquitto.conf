# /etc/mosquitto/mosquitto.conf
#
# Local broker configuration for the edge server Docker container.
#
# This broker serves two purposes:
#   1. Receives telemetry from telemetry_bridge.py (publishing drone/telemetry/position)
#   2. Exposes that topic to external subscribers (your Starlink downstream consumer)
#
# Security note: This config allows unauthenticated connections. If your edge
# server is directly internet-facing over Starlink, add a password file:
#   password_file /etc/mosquitto/passwd
# and create credentials with: mosquitto_passwd -c /etc/mosquitto/passwd <username>
#
# Then set allow_anonymous to false and configure your subscriber accordingly.

listener 1883 0.0.0.0
allow_anonymous true

# Persistence: store retained messages across restarts.
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest stderr
log_type error
log_type warning
log_type notice
